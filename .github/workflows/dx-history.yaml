name: Trigger Labeler

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  call-dx-labeler:
    uses: pagarme/github-runner-validator/.github/workflows/dx-labeler.yaml@main
    with:
      pr_number: ${{ inputs.pr_number }}
    secrets: inherit
